name: Dependabot Auto-Merge

# Privileged half of the Dependabot auto-merge pipeline (see
# dependabot-build-check.yml for why this is split in two). Triggered by
# workflow_run, which always runs using the workflow file on the default
# branch and always gets real repository secrets and permissions --
# regardless of who or what triggered the upstream pull_request run. It
# never runs `npm ci` / installs the new dependency itself, so it never
# executes untrusted postinstall scripts with secrets in the environment.
#
# Fails closed at every step: any error, any missing signal, or any
# low-confidence review leaves the PR open for a human instead of merging.
# Major version bumps are handled entirely in dependabot-build-check.yml
# and are never touched here.

on:
  workflow_run:
    workflows: ["Dependabot Build Check"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  actions: read

jobs:
  review-and-merge:
    if: (github.event.workflow_run.conclusion == 'success' || github.event.workflow_run.conclusion == 'failure') && startsWith(github.event.workflow_run.head_branch, 'dependabot/')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Download metadata from build-check run
        uses: actions/download-artifact@v4
        with:
          name: dependabot-meta
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ./dependabot-meta

      - name: Load metadata
        id: meta
        run: |
          cat dependabot-meta/meta.json
          {
            echo "pr_url=$(jq -r .pr_url dependabot-meta/meta.json)"
            echo "update_type=$(jq -r .update_type dependabot-meta/meta.json)"
            echo "build_outcome=$(jq -r .build_outcome dependabot-meta/meta.json)"
            echo "dependency_names=$(jq -r .dependency_names dependabot-meta/meta.json)"
            echo "previous_version=$(jq -r .previous_version dependabot-meta/meta.json)"
            echo "new_version=$(jq -r .new_version dependabot-meta/meta.json)"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout PR head
        if: steps.meta.outputs.update_type != 'version-update:semver-major' && steps.meta.outputs.build_outcome == 'success'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Comment if build failed
        if: steps.meta.outputs.update_type != 'version-update:semver-major' && steps.meta.outputs.build_outcome != 'success'
        run: gh pr comment "$PR_URL" --body "Build failed on this update -- not auto-merging. Needs manual review."
        env:
          PR_URL: ${{ steps.meta.outputs.pr_url }}

      - name: Quality review (same standard as .claude/agents/quality-reviewer.md)
        if: steps.meta.outputs.update_type != 'version-update:semver-major' && steps.meta.outputs.build_outcome == 'success'
        id: review
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            Review this Dependabot pull request in the same spirit as this repo's
            .claude/agents/quality-reviewer.md: unbiased, adversarial, and willing to say no.

            This is a ${{ steps.meta.outputs.update_type }} update for
            ${{ steps.meta.outputs.dependency_names }}, from
            ${{ steps.meta.outputs.previous_version }} to
            ${{ steps.meta.outputs.new_version }}. The build already passed.

            Check specifically:
            1. Does the diff touch ONLY package.json / package-lock.json (or the relevant
               manifest for this ecosystem)? Any unrelated file changes are an automatic
               reject -- Dependabot PRs should never contain surprise edits.
            2. Is there a changelog or release notes entry available (check the PR body /
               linked release) mentioning breaking changes, deprecations, or security
               advisories that a patch/minor bump shouldn't normally carry?
            3. Does this package appear anywhere in this project in a way that a routine
               bump could plausibly break (check actual usage in the codebase, not just
               that it's listed as a dependency) -- e.g. this project cannot use
               `export const runtime = 'edge'`-incompatible Node APIs (see CLAUDE.md),
               so an update introducing a Node-only API in a package used from an edge
               route is a real risk here specifically.
            4. Is the reported update-type consistent with the actual version numbers
               (semver-minor should never jump a major version digit)?

            Return your assessment as structured output.
          claude_args: |
            --max-turns 8
            --allowedTools Read,Grep,Glob,Bash(git diff:*),Bash(git show:*)
            --json-schema '{"type":"object","properties":{"confidence":{"type":"integer","minimum":1,"maximum":5},"reasoning":{"type":"string"},"safe_to_merge":{"type":"boolean"}},"required":["confidence","reasoning","safe_to_merge"]}'

      - name: Merge if confidence is high enough
        if: steps.meta.outputs.update_type != 'version-update:semver-major' && steps.meta.outputs.build_outcome == 'success' && fromJSON(steps.review.outputs.structured_output || '{}').safe_to_merge == true && fromJSON(steps.review.outputs.structured_output || '{}').confidence >= 4
        run: |
          gh pr comment "$PR_URL" --body "Auto-merging: quality-reviewer confidence ${CONFIDENCE}/5. ${REASONING}"
          gh pr merge "$PR_URL" --auto --squash
        env:
          PR_URL: ${{ steps.meta.outputs.pr_url }}
          CONFIDENCE: ${{ fromJSON(steps.review.outputs.structured_output || '{}').confidence }}
          REASONING: ${{ fromJSON(steps.review.outputs.structured_output || '{}').reasoning }}

      - name: Leave for human review if confidence is low
        if: steps.meta.outputs.update_type != 'version-update:semver-major' && steps.meta.outputs.build_outcome == 'success' && (fromJSON(steps.review.outputs.structured_output || '{}').safe_to_merge != true || fromJSON(steps.review.outputs.structured_output || '{}').confidence < 4)
        run: |
          gh pr comment "$PR_URL" --body "Not auto-merging: quality-reviewer confidence ${CONFIDENCE}/5. ${REASONING}"
          gh pr edit "$PR_URL" --add-label "needs-manual-review"
        env:
          PR_URL: ${{ steps.meta.outputs.pr_url }}
          CONFIDENCE: ${{ fromJSON(steps.review.outputs.structured_output || '{}').confidence }}
          REASONING: ${{ fromJSON(steps.review.outputs.structured_output || '{}').reasoning }}
